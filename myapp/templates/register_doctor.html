{% extends 'base.html' %}

{% block title %}
    Doctor Registration
{% endblock %}

{% block content %}
    <h1>Doctor Registration</h1>
    <form method="post">
        {% csrf_token %}
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name"><br>
        <label for="specialization">Specialization:</label><br>
        <input type="text" id="specialization" name="specialization"><br>
        <label for="qualification">Qualification:</label><br>
        <input type="text" id="qualification" name="qualification"><br>
        <label for="experience">Experience (years):</label><br>
        <input type="number" id="experience" name="experience"><br>
        <label for="contact_number">Contact Number:</label><br>
        <input type="text" id="contact_number" name="contact_number"><br>
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email"><br>
        <label for="password">Password:</label><br>  
        <input type="password" id="password" name="password"><br><br>  
        <button type="submit">Register</button>
    </form>
{% endblock %}
